<style>
:root{--tile:#0C8B8B;--tile-deep:#0A6E6E;--tile-soft:#E4F1F0;--gold:#E0A32E;--ink:#12262B;--muted:#63797C;--bg:#EFF3F3;--card:#FFFFFF;--line:#E0E8E8;--danger:#D64545;--shadow:0 1px 2px rgba(18,38,43,.06),0 8px 24px rgba(18,38,43,.06);--radius:16px}
body.dark{--ink:#E6EDED;--muted:#8FA3A5;--bg:#0E1719;--card:#162427;--line:#25383B;--tile-soft:#12302F;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
body.dark .logo b{color:#E6EDED}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
img{display:block;max-width:100%}
.brand-font{font-family:'Space Grotesk',sans-serif}

header{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.head-row{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk';font-weight:700;font-size:21px;letter-spacing:-.5px}
.logo .mark{width:32px;height:32px;border-radius:10px;flex:none;background:linear-gradient(135deg,var(--tile),var(--tile-deep));display:grid;place-items:center;color:#fff;font-size:17px;box-shadow:0 4px 10px rgba(12,139,139,.35)}
.logo b{color:var(--ink)}.logo i{color:var(--tile);font-style:normal}
.search-wrap{flex:1;position:relative;min-width:0}
.search-wrap input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none;transition:.15s}
.search-wrap input:focus{border-color:var(--tile);background:#fff}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.icon-btn.theme{flex:none}
.icon-btn.recent.on{background:var(--tile);color:#fff;border-color:var(--tile)}
.card.vip{border:1.5px solid var(--gold);box-shadow:0 2px 4px rgba(224,163,46,.18),0 10px 28px rgba(224,163,46,.14)}
.badge-vip{position:absolute;top:8px;left:8px;z-index:2;background:linear-gradient(135deg,#F0B843,#E0A32E);color:#3a2a05;font-size:11px;font-weight:800;padding:4px 9px;border-radius:7px;letter-spacing:.3px;box-shadow:0 2px 6px rgba(224,163,46,.4)}
.msg-modal{display:none;position:fixed;inset:0;z-index:9998;background:rgba(18,38,43,.5);align-items:flex-end;justify-content:center}
.msg-modal.on{display:flex}
.msg-sheet{position:relative;background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 18px 26px;max-height:82vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.msg-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border:none;border-radius:50%;background:var(--tile-soft);color:var(--ink);font-size:16px;cursor:pointer}
.msg-sheet h3{font-size:18px;margin:0 0 4px;font-family:var(--brand)}
.msg-sheet .msg-sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.msg-field{margin-bottom:12px}
.msg-field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.msg-field input,.msg-field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14.5px;font-family:inherit;background:var(--bg);color:var(--ink);box-sizing:border-box}
.msg-field textarea{min-height:90px;resize:vertical}
.msg-send{width:100%;background:var(--tile);color:#fff;border:none;border-radius:13px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.msg-item{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;background:var(--bg)}
.msg-item .mi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.msg-item .mi-name{font-weight:700;font-size:14px}
.msg-item .mi-time{color:var(--muted);font-size:11.5px}
.msg-item .mi-text{font-size:14px;line-height:1.5;margin-bottom:8px}
.msg-item .mi-actions{display:flex;gap:8px}
.msg-item .mi-actions a{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:600;padding:8px;border-radius:9px;border:1px solid var(--line);color:var(--ink)}
.msg-empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.act.msg{background:var(--tile-soft);border-color:var(--tile-soft);color:var(--tile-deep)}
.d-vip-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#F0B843,#E0A32E);color:#3a2a05;font-size:13px;font-weight:800;padding:5px 12px;border-radius:8px;margin-bottom:10px}
.act.vip{background:#FFF8EC;border-color:#E7C87E;color:#8a6410}
.btn-install{flex:none;display:inline-flex;align-items:center;gap:5px;background:var(--gold);color:#3a2a05;font-weight:700;font-size:13px;padding:8px 12px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-post{flex:none;display:flex;align-items:center;gap:6px;background:var(--tile);color:#fff;font-weight:700;font-size:15px;padding:11px 15px;border-radius:12px;box-shadow:0 4px 12px rgba(12,139,139,.3);transition:.15s}
.btn-post:active{transform:scale(.96)}
.btn-post .plus{font-size:18px;line-height:1}.btn-post .lbl{display:none}
@media(min-width:560px){.btn-post .lbl{display:inline}}

.segwrap{max-width:1100px;margin:0 auto;padding:12px 14px 0}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);transition:.15s}
.seg button.on{background:var(--ink);color:#fff}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink);transition:.12s;white-space:nowrap}
.chip .em{font-size:16px}
.chip.active{background:var(--tile);color:#fff;border-color:var(--tile)}
.chip:active{transform:scale(.96)}

.toolbar{display:flex;gap:8px;padding:8px 14px 4px;max-width:1100px;margin:0 auto;align-items:center}
.tool-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--card);font-weight:700;font-size:14px;color:var(--ink);transition:.12s}
.tool-btn:active{transform:scale(.97)}
.tool-btn .fbadge{background:var(--gold);color:#3a2a05;font-size:11px;font-weight:800;padding:1px 7px;border-radius:8px}
.icon-btn{flex:none;width:46px;padding:11px 0;border:1px solid var(--line);border-radius:11px;background:var(--card);font-size:18px;display:grid;place-items:center;transition:.12s}
.icon-btn.on{background:var(--tile);color:#fff;border-color:var(--tile)}
.icon-btn.fav.on{background:var(--danger);border-color:var(--danger);color:#fff}
.view-toggle{flex:none;display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.view-toggle button{padding:11px 12px;font-size:16px;color:var(--muted)}
.view-toggle button.on{background:var(--tile);color:#fff}
.c-dist{color:var(--tile-deep);font-weight:700}
#adSlot{margin:0 0 14px}
.adbox{position:relative;display:block;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--card)}
.adbox img{width:100%;display:block;max-height:200px;object-fit:cover}
.adbox .adtag{position:absolute;top:8px;left:8px;background:rgba(18,38,43,.6);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.3px}
.adbox .adx{position:absolute;top:8px;right:8px;width:26px;height:26px;border:none;border-radius:50%;background:rgba(18,38,43,.6);color:#fff;font-size:15px;cursor:pointer;line-height:1}
.addots{display:flex;gap:5px;justify-content:center;padding:8px 0 0}
.addots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:inline-block}
.addots i.on{background:var(--tile)}
.act.report{flex:0 0 auto;background:#fff3f0;border-color:#f0c4b8;color:#b23c1e}
.load-more-wrap{display:flex;justify-content:center;padding:14px 0}
.btn-more{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:11px 24px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.near-radius{display:flex;align-items:center;gap:6px;padding:8px 14px 2px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.near-radius button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.near-radius button.on{background:var(--tile);border-color:var(--tile);color:#fff}
.tool-btn.on{background:var(--tile);color:#fff}
.count{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;padding:6px 2px 0;max-width:1100px;margin:0 auto;display:block}

main{max-width:1100px;margin:0 auto;padding:8px 14px 40px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.15s;display:flex;flex-direction:column;border:1px solid rgba(224,232,232,.6)}
.card:active{transform:scale(.985)}
.card-img{position:relative;aspect-ratio:4/3;background:var(--tile-soft);overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-img .noimg{width:100%;height:100%;display:grid;place-items:center;font-size:34px;opacity:.4}
.badge-count{position:absolute;right:8px;bottom:8px;background:rgba(18,38,43,.72);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;backdrop-filter:blur(4px)}
.badge-deal{position:absolute;left:8px;top:8px;color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px;letter-spacing:.3px}
.badge-deal.sell{background:var(--tile-deep)}.badge-deal.rent{background:var(--gold);color:#3a2a05}
.fav-btn{position:absolute;top:7px;right:7px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:16px;color:#b7c3c3;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:.15s;z-index:2}
.fav-btn.on{color:var(--danger)}
.fav-btn:active{transform:scale(.82)}
.card-body{padding:10px 11px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.price{font-family:'Space Grotesk';font-weight:700;font-size:17px;color:var(--ink);letter-spacing:-.3px}
.price .cur,.price .per{font-size:12px;color:var(--muted);font-weight:600}
.c-specs{font-size:12.5px;color:var(--tile-deep);font-weight:600}
.c-title{font-size:13.5px;font-weight:500;color:#33484c;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.c-meta{margin-top:auto;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.c-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted);flex:none}

#listMap{display:none;height:calc(100vh - 250px);min-height:360px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.price-pin{background:var(--tile);color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:12.5px;padding:5px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.3);border:2px solid #fff}
.price-pin.rent{background:var(--gold);color:#3a2a05}
.price-pin::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff}

.state{text-align:center;padding:70px 20px;color:var(--muted)}
.state .em{font-size:46px;margin-bottom:12px}.state h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.skel{background:linear-gradient(90deg,#e8eeee 25%,#f2f6f6 50%,#e8eeee 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

const toUZS=x=>x.valyuta==="USD"?Number(x.narx||0)*USD_RATE:Number(x.narx||0);
function distKm(aLat,aLng,bLat,bLng){if(aLat==null||bLat==null)return null;const R=6371,dLat=(bLat-aLat)*Math.PI/180,dLng=(bLng-aLng)*Math.PI/180,q=Math.sin(dLat/2)**2+Math.cos(aLat*Math.PI/180)*Math.cos(bLat*Math.PI/180)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));}
function fmtKm(d){return d==null?"":d<1?Math.round(d*1000)+" m":d.toFixed(d<10?1:0)+" km";}
function priceHTML(x){const per=x.bitim==="ijara"?` <span class="per">/oy</span>`:"";return Number(x.narx)>0?`${fmtNum(x.narx)} <span class="cur">${x.valyuta}</span>${per}`:`<span style="color:var(--tile-deep)">Kelishilgan</span>`}
function pinHTML(x){const per=x.bitim==="ijara"?"/oy":"";const v=x.valyuta==="USD"?"$"+fmtShort(x.narx):fmtShort(x.narx);return Number(x.narx)>0?v+per:"Kelishilgan"}

function deepLink(){const pid=new URLSearchParams(location.search).get("id");if(pid&&LISTINGS.some(l=>String(l.id)===pid))openDetail(pid)}

function filtered(){
  let r=LISTINGS.slice();
  if(state.favOnly)r=r.filter(x=>isFav(x.id));
  if(state.recentOnly){var rec=getRecent();var idx={};rec.forEach(function(id,i){idx[String(id)]=i;});r=r.filter(x=>idx[String(x.id)]!=null).sort((a,b)=>idx[String(a.id)]-idx[String(b.id)]);}
  if(state.deal!=="all")r=r.filter(x=>x.bitim===state.deal);
  if(state.type!=="all")r=r.filter(x=>x.kategoriya===state.type);
  if(state.region!=="all")r=r.filter(x=>x.hudud===state.region);
  if(state.priceMin!=null){const m=state.priceCur==="USD"?state.priceMin*USD_RATE:state.priceMin;r=r.filter(x=>Number(x.narx)>0&&toUZS(x)>=m)}
  if(state.priceMax!=null){const m=state.priceCur==="USD"?state.priceMax*USD_RATE:state.priceMax;r=r.filter(x=>Number(x.narx)>0&&toUZS(x)<=m)}
  if(state.rooms!=="all"){r=state.rooms==="4"?r.filter(x=>Number(x.xonalar)>=4):r.filter(x=>Number(x.xonalar)===Number(state.rooms))}
  if(state.areaMin!=null)r=r.filter(x=>Number(x.maydon)>=state.areaMin);
  if(state.areaMax!=null)r=r.filter(x=>Number(x.maydon)<=state.areaMax);
  if(state.search){const q=state.search.toLowerCase();r=r.filter(x=>(x.sarlavha||"").toLowerCase().includes(q)||(x.tavsif||"").toLowerCase().includes(q)||(x.manzil||"").toLowerCase().includes(q))}
  if(state.near&&state.myLat!=null){
    r=r.map(x=>{x._dist=distKm(state.myLat,state.myLng,x.lat,x.lng);return x;})
       .filter(x=>x._dist!=null&&x._dist<=state.nearKm);
  } else { r.forEach(x=>{x._dist=null;}); }
  if(state.sort==="new")r.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  if(state.sort==="old")r.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  if(state.sort==="cheap")r.sort((a,b)=>toUZS(a)-toUZS(b));
  if(state.sort==="exp")r.sort((a,b)=>toUZS(b)-toUZS(a));
  // VIP e'lonlar doim tepada (joriy tartibni saqlagan holda)
  r=r.slice().sort((a,b)=>(isVip(b)?1:0)-(isVip(a)?1:0));
  return r;
}
function render(){const list=filtered();state.page=1;document.getElementById("count").textContent=list.length+" ta e'lon";renderGrid(list);if(state.view==="map")renderMap(list)}
const PAGE_SIZE=60;

  const grid=document.getElementById("grid");

  const shown=list.slice(0,state.page*PAGE_SIZE);
  grid.innerHTML=shown.map(x=>{
    const img=x.rasmlar&&x.rasmlar[0],t=typeOf(x.kategoriya);
    const specs=[x.xonalar?x.xonalar+" xona":"",x.maydon?x.maydon+" m²":"",x.qavat?x.qavat+"-q":""].filter(Boolean).join(" · ");
    return `<article class="card${isVip(x)?" vip":""}" data-id="${x.id}">
      <div class="card-img">${isVip(x)?`<span class="badge-vip">⭐ VIP</span>`:""}${img?`<img loading="lazy" src="${img}" alt="">`:`<div class="noimg">${t.em}</div>`}
        <button class="fav-btn ${isFav(x.id)?"on":""}" data-fav="${x.id}">♥</button>
        <span class="badge-deal ${x.bitim==="ijara"?"rent":"sell"}">${x.bitim==="ijara"?"IJARAGA":"SOTILADI"}</span>
        ${x.rasmlar&&x.rasmlar.length>1?`<span class="badge-count">📷 ${x.rasmlar.length}</span>`:""}</div>
      <div class="card-body">
        <div class="price">${priceHTML(x)}</div>
        ${specs?`<div class="c-specs">${specs}</div>`:""}
        <div class="c-title">${esc(x.sarlavha)}</div>
        <div class="c-meta">${x._dist!=null?`<span class="c-dist">📍 ${fmtKm(x._dist)}</span><span class="dot"></span>`:""}${x.hudud}<span class="dot"></span>${timeAgo(x.created_at)}${Number(x.korilgan)>0?`<span class="dot"></span>👁 ${x.korilgan}`:""}</div>
      </div></article>`;
  }).join("")+(shown.length<list.length?`<div class="load-more-wrap" style="grid-column:1/-1"><button class="btn-more" id="loadMore">Yana ko'rsatish (${list.length-shown.length})</button></div>`:"");
  const lm=grid.querySelector("#loadMore");if(lm)lm.onclick=()=>{state.page++;renderGrid(list);};
  grid.querySelectorAll(".card").forEach(c=>c.onclick=e=>{if(e.target.closest(".fav-btn"))return;openDetail(c.dataset.id)});
  grid.querySelectorAll(".fav-btn").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(b.dataset.fav);b.classList.toggle("on",isFav(b.dataset.fav))});
}
function showSkeleton(){document.getElementById("grid").innerHTML=Array(6).fill(`<div class="skel-card"><div class="a skel"></div><div class="b skel"></div><div class="c skel"></div></div>`).join("")}

function toggleFav(id){id=String(id);if(FAVS.has(id))FAVS.delete(id);else FAVS.add(id);saveFavs();if(state.favOnly)render()}

/* Map view */
function setView(v){
  state.view=v;
  document.getElementById("vList").classList.toggle("on",v==="list");
  document.getElementById("vMap").classList.toggle("on",v==="map");
  document.getElementById("grid").style.display=v==="list"?"":"none";
  document.getElementById("listMap").style.display=v==="map"?"block":"none";
  if(v==="map"){ensureListMap();renderMap(filtered());setTimeout(()=>{if(listMapObj){listMapObj.invalidateSize();centerListMap()}},60)}

function ensureListMap(){
  if(listMapObj)return;
  if(typeof L==="undefined"){toast("Xarita yuklanmadi — internetni tekshiring",1);return}
  listMapObj=L.map("listMap",{zoomControl:true}).setView([41.3,64.6],6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(listMapObj);
}
function renderMap(list){
  if(!listMapObj)return;
  listMarkers.forEach(m=>listMapObj.removeLayer(m));listMarkers=[];
  list.forEach(x=>{if(x.lat==null||x.lng==null)return;const icon=L.divIcon({className:"",html:`<div class="price-pin ${x.bitim==="ijara"?"rent":""}">${pinHTML(x)}</div>`,iconSize:null,iconAnchor:[0,0]});const m=L.marker([x.lat,x.lng],{icon}).addTo(listMapObj);m.on("click",()=>openDetail(x.id));listMarkers.push(m)});
}
function centerListMap(){if(!listMapObj)return;const pts=listMarkers.map(m=>m.getLatLng());if(pts.length)listMapObj.fitBounds(L.latLngBounds(pts).pad(.2),{maxZoom:14});else if(state.region!=="all"&&REGION_COORD[state.region])listMapObj.setView(REGION_COORD[state.region],12)}

function shareListing(x){

  if(navigator.share){navigator.share({title:"Jo'ra",text,url}).catch(()=>{})}
  else if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>toast("Havola nusxalandi ✓")).catch(()=>toast(url))}
  else toast(url);
}
async function reportListing(id){
  if(!confirm("Bu e'londan shikoyat qilasizmi? (yolg'on/nomaqbul)"))return;

function buildPhotos(){
  const el=document.getElementById("photos");
  const thumbs=draftPhotos.map((p,i)=>`<div class="photo-thumb"><img src="${p.url}"><button class="rm" data-i="${i}">✕</button></div>`).join("");
  const add=draftPhotos.length<8?`<button type="button" class="photo-add" id="photoAdd"><span class="e">＋</span>Rasm</button>`:"";
  el.innerHTML=thumbs+add;
  const a=document.getElementById("photoAdd");if(a)a.onclick=()=>document.getElementById("fileInput").click();
  el.querySelectorAll(".rm").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(draftPhotos[i].url.startsWith("blob:"))URL.revokeObjectURL(draftPhotos[i].url);draftPhotos.splice(i,1);buildPhotos()});
}
async function onFiles(e){const files=[...e.target.files];e.target.value="";for(const f of files){if(draftPhotos.length>=8)break;if(!f.type.startsWith("image/"))continue;const c=await compressImage(f);draftPhotos.push({file:c,url:URL.createObjectURL(c)})}buildPhotos()}
function compressImage(file){return new Promise(res=>{const img=new Image(),rd=new FileReader();rd.onload=()=>img.src=rd.result;img.onload=()=>{const max=1200;let{width:w,height:h}=img;if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);cv.toBlob(b=>res(new File([b],"p.jpg",{type:"image/jpeg"})),"image/jpeg",.82)};rd.readAsDataURL(file)})}

function ensurePostMap(){
  if(postMapObj)return;
  if(typeof L==="undefined")return toast("Xarita yuklanmadi — internetni tekshiring",1);
  postMapObj=L.map("postMap",{zoomControl:true}).setView([draftLoc.lat,draftLoc.lng],13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OSM"}).addTo(postMapObj);
  postMarker=L.marker([draftLoc.lat,draftLoc.lng],{draggable:true}).addTo(postMapObj);
  postMarker.on("dragend",()=>{const ll=postMarker.getLatLng();draftLoc={lat:ll.lat,lng:ll.lng}});
  postMapObj.on("click",e=>{draftLoc={lat:e.latlng.lat,lng:e.latlng.lng};postMarker.setLatLng(e.latlng)});
}
function myLocation(){
  if(!navigator.geolocation)return toast("Bu qurilmada geolokatsiya yo'q",1);
  if(!window.isSecureContext)return toast("Joylashuv faqat HTTPS saytda ishlaydi. Xaritadan tanlang",1);
  toast("Joylashuv aniqlanmoqda...");
  navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;draftLoc={lat,lng};if(postMapObj){postMapObj.setView([lat,lng],16);postMarker.setLatLng([lat,lng])}toast("Joylashuv topildi ✓")},err=>{let m="Xaritadan qo'lda tanlang";if(err.code===1)m="Ruxsat berilmadi. Xaritadan tanlang";else if(err.code===2)m="Joylashuv topilmadi. Xaritadan tanlang";else if(err.code===3)m="Vaqt tugadi. Xaritadan tanlang";toast(m,1)},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}

async function submitPost(){
  const title=val("fTitle"),price=val("fPrice"),region=val("fRegion"),desc=val("fDesc"),name=val("fName"),phone=val("fPhone"),cur=val("fCur");
  const rooms=val("fRooms"),area=val("fArea"),floor=val("fFloor"),addr=val("fAddr");
  if(!draftType)return toast("Ko'chmas mulk turini tanlang",1);
  if(!title||title.trim().length<5)return toast("Sarlavha kamida 5 harf bo'lsin",1);
  if(price===""||Number(price)<0||isNaN(Number(price)))return toast("Narx noto'g'ri (0 yoki musbat son)",1);
  if(!region)return toast("Hududni tanlang",1);
  if(!draftLoc||draftLoc.lat==null)return toast("Xaritadan joyni belgilang",1);
  if(!name)return toast("Ismingizni yozing",1);
  if(!phone||phone.replace(/\D/g,"").length<9)return toast("To'g'ri telefon kiriting (9 raqam)",1);
  const btn=document.getElementById("submitPost");btn.disabled=true;btn.innerHTML=`<span class="spin"></span>`;
  try{
    try{localStorage.setItem("jora_me",JSON.stringify({name,phone}))}catch(e){}
    let urls=[];
    for(const p of draftPhotos){
      if(p.existing){urls.push(p.url);continue}
      if(DEMO_MODE){urls.push(p.url);continue}
      const path=`${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
      const{error:up}=await sb.storage.from(STORAGE_BUCKET).upload(path,p.file,{contentType:"image/jpeg"});if(up)throw up;
      urls.push(sb.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl);
    }
    const row={bitim:draftDeal,kategoriya:draftType,sarlavha:title,tavsif:desc,narx:Number(price)||0,valyuta:cur,xonalar:rooms?Number(rooms):null,maydon:area?Number(area):null,qavat:floor||null,hudud:region,lat:draftLoc.lat,lng:draftLoc.lng,manzil:addr||null,ism:name,telefon:phone,rasmlar:urls,holat:"active"};
    if(EDIT_ID){
      if(DEMO_MODE){const i=LISTINGS.findIndex(l=>String(l.id)===String(EDIT_ID));if(i>-1)LISTINGS[i]={...LISTINGS[i],...row}}
      else{const{data,error}=await sb.rpc("elon_update",{p_id:Number(EDIT_ID),p_token:MINE[String(EDIT_ID)],p_data:row});if(error)throw error;const i=LISTINGS.findIndex(l=>String(l.id)===String(EDIT_ID));if(i>-1&&data)LISTINGS[i]=data}
      toast("O'zgarishlar saqlandi ✓");
    }else{
      const token=Math.random().toString(36).slice(2)+Date.now().toString(36);
      row.owner_token=token;
      let newId;
      if(DEMO_MODE){newId="n"+Date.now();LISTINGS.unshift({...row,id:newId,created_at:new Date().toISOString()})}
      else{const{data,error}=await sb.from("elonlar").insert(row).select();if(error)throw error;newId=data[0].id;LISTINGS.unshift(data[0])}
      MINE[String(newId)]=token;saveMine();
      toast("E'lon joylandi ✓");
    }
    EDIT_ID=null;draftPhotos.length=0;
    closePost();render();if(state.view==="map")renderMap(filtered());
  }catch(e){console.error(e);toast("Xatolik: "+(e.message||"qayta urinib ko'ring"),1)}
  finally{btn.disabled=false;btn.textContent=EDIT_ID?"O'zgarishlarni saqlash":"E'lonni joylash"}
}

  if(!navigator.geolocation)return toast("Bu qurilmada geolokatsiya yo'q",1);
  if(!window.isSecureContext)return toast("Joylashuv faqat HTTPS saytda ishlaydi",1);
  btn.innerHTML="⏳ Qidirilmoqda…";
  navigator.geolocation.getCurrentPosition(pos=>{
    state.myLat=pos.coords.latitude; state.myLng=pos.coords.longitude;
    state.near=true; state.sort="cheap";
    const sortSel=document.getElementById("ffSort"); if(sortSel)sortSel.value="cheap";
    btn.classList.add("on"); btn.innerHTML="📍 Yaqinimda ✕";
    document.getElementById("nearRadius").style.display="flex";
    render(); if(state.view==="map")renderMap(filtered());
    const n=filtered().length;
    toast(n?("Yaqin "+state.nearKm+" km: "+n+" ta e'lon, arzonidan"):("Yaqin "+state.nearKm+" km da e'lon yo'q"), n?0:1);
  }, err=>{
    btn.innerHTML="📍 Yaqinimda";
    let m="Joylashuv topilmadi"; if(err.code===1)m="Ruxsat berilmadi"; else if(err.code===3)m="Vaqt tugadi, qayta urining";
    toast(m,1);
  }, {enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
let toastT;function toast(m,e){const t=document.getElementById("toast");t.textContent=m;t.className="toast show"+(e?" err":"");clearTimeout(toastT);toastT=setTimeout(()=>t.className="toast",2600)}

function bindEvents(){
  document.getElementById("openPost").onclick=()=>openPost();
  document.getElementById("closePost").onclick=closePost;
  document.getElementById("postBg").onclick=closePost;
  document.getElementById("detailBg").onclick=closeDetail;
  document.getElementById("submitPost").onclick=submitPost;
  renderBanner();initTheme();
  document.getElementById("fileInput").onchange=onFiles;
  document.getElementById("myLoc").onclick=myLocation;
  document.getElementById("vList").onclick=()=>setView("list");
  document.getElementById("vMap").onclick=()=>setView("map");
  document.getElementById("openFilter").onclick=openFilter;
  document.getElementById("closeFilter").onclick=()=>closeSheet("filterSheet","filterBg");
  document.getElementById("filterBg").onclick=()=>closeSheet("filterSheet","filterBg");
  document.getElementById("applyFilter").onclick=applyFilterFromSheet;
  document.getElementById("clearFilter").onclick=clearFilters;
  document.getElementById("favToggle").onclick=()=>{state.favOnly=!state.favOnly;if(state.favOnly){state.recentOnly=false;document.getElementById("recentToggle").classList.remove("on");}document.getElementById("favToggle").classList.toggle("on",state.favOnly);render()};
  document.getElementById("recentToggle").onclick=()=>{state.recentOnly=!state.recentOnly;if(state.recentOnly){state.favOnly=false;document.getElementById("favToggle").classList.remove("on");}document.getElementById("recentToggle").classList.toggle("on",state.recentOnly);render()};
  document.getElementById("nearBtn").onclick=toggleNear;
  document.querySelectorAll("#ffCur button").forEach(b=>b.onclick=()=>document.querySelectorAll("#ffCur button").forEach(x=>x.classList.toggle("on",x===b)));
  document.querySelectorAll("#ffRooms .rchip").forEach(b=>b.onclick=()=>document.querySelectorAll("#ffRooms .rchip").forEach(x=>x.classList.toggle("on",x===b)));
  document.querySelectorAll("#dealSeg button").forEach(b=>b.onclick=()=>{state.deal=b.dataset.deal;document.querySelectorAll("#dealSeg button").forEach(x=>x.classList.toggle("on",x===b));render();if(state.view==="map")renderMap(filtered())});
  document.querySelectorAll("#dealPick button").forEach(b=>b.onclick=()=>{draftDeal=b.dataset.deal;document.querySelectorAll("#dealPick button").forEach(x=>x.classList.toggle("on",x===b));document.getElementById("priceHint").textContent=draftDeal==="ijara"?"Oylik narx. Kelishilgan bo'lsa 0.":"Kelishilgan bo'lsa 0 yozing."});
  let st;document.getElementById("search").oninput=e=>{clearTimeout(st);st=setTimeout(()=>{state.search=e.target.value.trim();render();if(state.view==="map")renderMap(filtered())},250)};
}

init();
</script>
